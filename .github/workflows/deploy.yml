name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Auto refresh dataset once every day at 00:00 UTC (08:00 AM TST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies 📦
        run: pip install requests pillow

      - name: Setup Node.js 🚀
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fetch Latest TDX CCTV Data 📹
        env:
          ClientId: ${{ secrets.TDX_CLIENT_ID }}
          ClientSecret: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python scripts/fetch_tdx_cctv.py

      - name: Generate Custom WebP Icons 🎨
        run: python scripts/generate_icons.py

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Build Project 🏗️
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
